<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>PurchifyShop - Online Shopping in Bangladesh | Fast Delivery & Secure Checkout</title>
    <meta name="title" content="PurchifyShop - Online Shopping in Bangladesh | Fast Delivery & Secure Checkout" />
    <meta name="description" content="Shop electronics, fashion, and daily needs at PurchifyShop. Fast delivery across Bangladesh, secure payment, and great deals. Order now for the best online shopping experience!" />
    <meta name="keywords" content="PurchifyShop, online shopping Bangladesh, buy online, e-commerce Bangladesh, fast delivery, secure checkout, electronics, fashion, daily needs" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="language" content="English" />
    <meta name="author" content="PurchifyShop" />
    <link rel="canonical" href="https://purchifyshop.com/" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://purchifyshop.com/" />
    <meta property="og:title" content="PurchifyShop - Online Shopping in Bangladesh" />
    <meta property="og:description" content="Shop electronics, fashion, and daily needs at PurchifyShop. Fast delivery and secure checkout across Bangladesh." />
    <meta property="og:image" content="https://purchifyshop.com/assets/og-image.jpg" />
    <meta property="og:site_name" content="PurchifyShop" />
    <meta property="og:locale" content="en_US" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://purchifyshop.com/" />
    <meta name="twitter:title" content="PurchifyShop - Online Shopping in Bangladesh" />
    <meta name="twitter:description" content="Shop electronics, fashion, and daily needs at PurchifyShop. Fast delivery and secure checkout across Bangladesh." />
    <meta name="twitter:image" content="https://purchifyshop.com/assets/og-image.jpg" />
    
    <!-- Structured Data - Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "PurchifyShop",
      "url": "https://purchifyshop.com",
      "logo": "https://purchifyshop.com/assets/logo.png",
      "description": "Leading online shopping destination in Bangladesh for electronics, fashion, and daily needs",
      "sameAs": [
        "https://www.facebook.com/purchifyshop",
        "https://www.instagram.com/purchifyshop"
      ]
    }
    </script>
    
    <!-- Structured Data - WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "PurchifyShop",
      "url": "https://purchifyshop.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://purchifyshop.com/shop?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <noscript>
      <div style="padding: 40px; text-align: center; font-family: system-ui, -apple-system, sans-serif;">
        <h1>PurchifyShop - Online Shopping in Bangladesh</h1>
        <p style="margin: 20px 0; font-size: 18px; color: #666;">
          JavaScript is required to fully experience our website. Please enable JavaScript in your browser.
        </p>
        <p style="margin: 20px 0;">
          Shop electronics, fashion, and daily needs at <strong>PurchifyShop</strong>. 
          Fast delivery across Bangladesh, secure payment, and great deals.
        </p>
        <p style="margin-top: 30px;">
          <a href="https://purchifyshop.com" style="color: #4f46e5; text-decoration: none; font-weight: 600;">
            Visit PurchifyShop →
          </a>
        </p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
